name: Test Suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Setup Rust
        run: rustup show

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Version consistency
        run: npm run check:versions

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust tests
        run: npm run cargo:test

      - name: Frontend unit tests
        run: npm run test:unit -- --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  java-bridges:
    name: Java bridges (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Setup Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle cache and validate wrappers
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Verify Windows wrapper launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\java-parser\gradlew.bat --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\jshell-bridge\gradlew.bat --version

      - name: Verify Unix wrapper launchers
        if: runner.os != 'Windows'
        run: |
          ./java-parser/gradlew --version
          ./jshell-bridge/gradlew --version

      - name: Test Java bridges
        run: npm run test:java

      - name: Package Java parser bridge
        run: npm run build:parser -- --no-daemon

      - name: Package JShell bridge
        run: npm run build:jshell -- --no-daemon
